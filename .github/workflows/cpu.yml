name: CPU tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      SUPRA_DOWNLOAD: "0"
      CONCEPTMOD_RUN_HUB_TESTS: "0"
      COMFYUI_ROOT: ""
      KREA_LOCAL_TRANSFORMER: ""
      KREA_OFFICIAL_INDEX: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build "pytest>=8"
          python -m pip install "torch==2.14.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Install shared core
        run: python -m pip install "conceptmod @ git+https://github.com/HyperGAN/conceptmod.git@main"
      - name: Build and install product wheel
        run: |
          python -m build --wheel
          python -m pip install dist/*.whl
      - name: Check installed package
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PYCODE'
          import importlib.util
          import os
          from pathlib import Path
          package = importlib.util.find_spec("zimage_conceptmod")
          assert package is not None
          assert not Path(package.origin).resolve().is_relative_to(Path(os.environ["GITHUB_WORKSPACE"]).resolve())
          import sys
          from conceptmod.providers import BackendRegistry
          registry = BackendRegistry()
          assert registry.names() == ("zimage",)
          assert registry.resolve("zimage").distribution == "zimage-conceptmod"
          assert not set(sys.modules) & {"torch", "diffusers", "transformers", "peft"}
          PYCODE
      - name: Test installed wheel offline
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib -q -rs
